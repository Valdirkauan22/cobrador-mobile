name: Gerar Cobrador Desktop 8.2.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-python/**'
      - '.github/workflows/windows-desktop-python.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: desktop-python/requirements.txt
      - run: pip install -r desktop-python/requirements.txt
      - name: Gerar EXE
        working-directory: desktop-python
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Cobrador_Associacao_8.2.1 --collect-all pystray --collect-all keyring Cobrancas_Associacao_v8_2_1.py
      - uses: actions/upload-artifact@v5
        with:
          name: Cobrador-Desktop-8.2.1-Windows
          path: desktop-python/dist/Cobrador_Associacao_8.2.1.exe
          if-no-files-found: error
          retention-days: 30
