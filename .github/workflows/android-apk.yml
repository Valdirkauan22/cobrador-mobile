name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Restaurar assinatura Android persistente
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: cobrador-mobile-debug-keystore-v1
      - name: Instalar Android SDK 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar dependências e sincronizar Android
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: Cobrador-Mobile-v1.3.1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
